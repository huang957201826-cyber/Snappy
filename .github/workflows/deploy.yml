name: Deploy Snappy v0.2.0 Release Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Pages build
        shell: bash
        run: |
          grep -Fq 'v0.2.0' dist/index.html
          grep -Rq 'releases/download/v0.2.0' dist/assets/*.js
          grep -Rq '4EEA1F5C896D2E51A9023CFF98CC7301E7290B6710E509660BBFE56349FDD411' dist/assets/*.js
          grep -Rq '75A88E0C58A931A8E56513B4AB708DA93B1AA281A40D59102F472DC0585ECAEC' dist/assets/*.js

      - name: Add SPA fallback
        shell: bash
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
