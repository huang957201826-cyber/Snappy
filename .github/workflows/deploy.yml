name: Deploy Snappy v0.2.0 Internal Beta Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify Pages build
        shell: bash
        run: |
          grep -Fq 'v0.2.0 内测版' dist/index.html
          grep -Fq '/Snappy/icon.svg' dist/index.html
          grep -Rq '/Snappy/screenshots/clipboard.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/translate.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/screenshot.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/notes.png' dist/assets/*.js
          grep -Rq 'releases/download/v0.2.0' dist/assets/*.js
          grep -Rq '15ADD7E81EB52448DA427AA94A594412B5C01FAE4A6832FA77B28B82721B3D20' dist/assets/*.js
          grep -Rq '75A88E0C58A931A8E56513B4AB708DA93B1AA281A40D59102F472DC0585ECAEC' dist/assets/*.js
          if grep -Rq '正式版' dist; then echo 'Formal release wording found in build output'; exit 1; fi
          for image in clipboard translate screenshot notes; do
            test -f "dist/screenshots/${image}.png"
            file "dist/screenshots/${image}.png" | grep -Fq 'PNG image data'
          done

      - name: Add SPA fallback
        shell: bash
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
