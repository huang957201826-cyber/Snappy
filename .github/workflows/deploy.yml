name: Deploy Snappy v0.2.1 Internal Beta Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm ci

      - name: Lint
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm run lint

      - name: Build
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm run build

      - name: Verify Pages build
        shell: bash
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: |
          set -x
          grep -Fq 'v0.2.1 内测版' dist/index.html
          grep -Fq '/Snappy/icon.svg' dist/index.html
          grep -Rq '/Snappy/screenshots/clipboard.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/translate.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/screenshot.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/notes.png' dist/assets/*.js
          grep -Rq 'releases/download/v0.2.1' dist/assets/*.js
          grep -Rq 'D6ADAE9C08240A6A5D635A6D48E5EFE151D725A9D933EFB7C80712EA972AAE6B' dist/assets/*.js
          grep -Rq '34A90FA01FBD93EF7D20F813A62D09C5516D7E11DC7A2DBCD739DA4BA3D231BF' dist/assets/*.js
          if grep -Rq '正式版' dist; then echo 'Formal release wording found in build output'; exit 1; fi
          for image in clipboard translate screenshot notes; do
            test -s "dist/screenshots/${image}.png"
          done

      - name: Add SPA fallback
        shell: bash
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./前端界面/snappy---windows轻量效率工具内测发布页/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
