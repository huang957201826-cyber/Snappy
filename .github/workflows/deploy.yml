name: Deploy Snappy v0.2.2 Internal Beta Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm ci

      - name: Lint
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm run lint

      - name: Build
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: npm run build

      - name: Verify Pages build
        shell: bash
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: |
          set -x
          grep -Fq 'v0.2.2 内测版' dist/index.html
          grep -Fq '/Snappy/icon.svg' dist/index.html
          grep -Rq '/Snappy/screenshots/clipboard.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/translate.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/screenshot.png' dist/assets/*.js
          grep -Rq '/Snappy/screenshots/notes.png' dist/assets/*.js
          grep -Rq 'releases/download/v0.2.2' dist/assets/*.js
          grep -Rq '3F971EB1EA57D99F1C19963FCD2D04F0A7E0946F5F73958064BF508B592541A5' dist/assets/*.js
          grep -Rq 'F5BE2E3B181D53EFA5E91441A90822AB7B4A905837F4C1CF59F506F4B45AB804' dist/assets/*.js
          if grep -Rq '正式版' dist; then echo 'Formal release wording found in build output'; exit 1; fi
          for image in clipboard translate screenshot notes; do
            test -s "dist/screenshots/${image}.png"
          done

      - name: Add SPA fallback
        shell: bash
        working-directory: ./前端界面/snappy---windows轻量效率工具内测发布页
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./前端界面/snappy---windows轻量效率工具内测发布页/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
